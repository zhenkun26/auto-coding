name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip ruff==0.16.2 mypy==2.3.0 pytest==9.1.1
      - name: Lint and type-check own scripts
        run: |
          ruff check scripts/ tests/
          mypy scripts/
      - name: Run unit tests
        run: python -m pytest tests/ -q
      - name: Run repository checks
        run: python scripts/check_repo.py
      - name: Verify plugin bundle is in sync
        run: |
          bash scripts/sync_plugin_skills.sh
          git diff --exit-code -- plugins/
