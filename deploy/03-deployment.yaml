apiVersion: apps/v1
kind: Deployment
metadata:
  name: auto-coding
  namespace: auto-coding
  labels:
    app.kubernetes.io/name: auto-coding
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: auto-coding
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auto-coding
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: auto-coding
          # Replace with your registry image: <YOUR_REGISTRY>/auto-coding:v0.1.0
          image: <YOUR_REGISTRY>/auto-coding:v0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: auto-coding-config
            - secretRef:
                name: auto-coding-secret
                optional: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
