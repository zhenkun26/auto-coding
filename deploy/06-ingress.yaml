apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auto-coding
  namespace: auto-coding
  # Replace with your ingress controller's class (e.g. nginx, traefik).
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: auto-coding.example.com # <-- replace with your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: auto-coding
                port:
                  name: http
