apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auto-coding
  namespace: auto-coding
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: auto-coding
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  # For custom metrics (e.g. requests-per-second), add a
  # - type: Object / External metric block pointing at your metrics adapter.
